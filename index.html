<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Botón Rojo</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #000;
      overflow: hidden;
    }
    button {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      border: none;
      background-color: red;
      color: white;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255,0,0,0.8);
      z-index: 10;
    }
    #mensaje {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 60px;
      color: white;
      text-align: center;
      display: none;
      z-index: 20;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
    }
  </style>
</head>
<body>
  <button onclick="mostrarMensaje()">Presióname</button>
  <div id="mensaje">CHINGA TU MADRE ALEXIS</div>
  <canvas id="fuegos"></canvas>

  <script>
    const canvas = document.getElementById('fuegos');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let fireworks = [];

    function mostrarMensaje() {
      document.getElementById('mensaje').style.display = 'block';
      lanzarFuegos();
    }

    function lanzarFuegos() {
      for (let i = 0; i < 20; i++) {
        fireworks.push(new Firework(Math.random() * canvas.width, Math.random() * canvas.height));
      }
      animate();
    }

    class Firework {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.particles = [];
        for (let i = 0; i < 50; i++) {
          this.particles.push({
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * 6,
            vy: (Math.random() - 0.5) * 6,
            alpha: 1
          });
        }
      }
      draw() {
        this.particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.alpha -= 0.01;
          ctx.fillStyle = `rgba(${Math.floor(Math.random()*255)},${Math.floor(Math.random()*255)},${Math.floor(Math.random()*255)},${p.alpha})`;
          ctx.fillRect(p.x, p.y, 2, 2);
        });
      }
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      fireworks.forEach(f => f.draw());
      fireworks = fireworks.filter(f => f.particles.some(p => p.alpha > 0));
      if (fireworks.length > 0) {
        requestAnimationFrame(animate);
      }
    }
  </script>
</body>
</html>
